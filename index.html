<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas.app</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
    <div class="noise"></div>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="dot"></div>
                <span>notas.app</span>
            </div>
            <div class="side-actions">
                <button id="newNote" class="ghost">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Nova
                </button>
                <label for="importFile" class="ghost">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Abrir
                </label>
                <input type="file" id="importFile" accept=".txt,.md,.html" hidden>
                <button id="exportNote" class="accent">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Exportar
                </button>
            </div>
            <div class="divider"></div>
            <div class="theme-toggle">
                <span>Tema</span>
                <div class="switch" id="themeSwitch">
                    <div class="thumb"></div>
                </div>
            </div>
        </aside>

        <main class="workspace">
            <div class="toolbar">
                <div class="tools-left">
                    <select id="fontPicker" title="Fonte">
                        <option value="'Outfit', sans-serif">Outfit</option>
                        <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
                        <option value="'Fraunces', serif">Fraunces</option>
                        <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
                    </select>
                    <div class="size-control">
                        <button id="decreaseSize">A-</button>
                        <span id="currentSize">18px</span>
                        <button id="increaseSize">A+</button>
                    </div>
                </div>
                <div class="tools-right">
                    <button class="tool" data-cmd="bold" title="Negrito"><b>B</b></button>
                    <button class="tool" data-cmd="italic" title="Itálico"><i>I</i></button>
                    <button class="tool" data-cmd="underline" title="Sublinhar"><u>U</u></button>
                    <div class="sep"></div>
                    <button class="tool" data-cmd="insertUnorderedList" title="Lista">• •</button>
                </div>
            </div>
