<!DOCTYPE html>
<html>
<head>
    <title>Simple Notepad</title>
</head>
<body>
    <h1>Simple Notepad</h1>
    <textarea id="notepad" rows="20" cols="80"></textarea>
    <br>
    <button onclick="saveNotepad()">Save Notepad</button>

    <script>
        function saveNotepad() {
            const notepadContent = document.getElementById('notepad').value;
            localStorage.setItem('notepadContent', notepadContent);
            alert('Notepad saved!');
        }

        // Load saved content when the page loads
        window.onload = function() {
            const savedContent = localStorage.getItem('notepadContent');
            if (savedContent) {
                document.getElementById('notepad').value = savedContent;
            }
        };
    </script>
</body>
</html>
